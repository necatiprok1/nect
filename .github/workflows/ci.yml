name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Native build (${{ matrix.target }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            variant: lean
            features: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            variant: full
            features: '--features full'
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            variant: lean
            features: ''
          - os: macos-15
            target: aarch64-apple-darwin
            variant: lean
            features: ''
          - os: macos-15
            target: aarch64-apple-darwin
            variant: full
            features: '--features full'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            variant: lean
            features: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: lean
            features: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: full
            features: '--features full'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Build
        run: cargo build --locked --release --no-default-features ${{ matrix.features }} --target ${{ matrix.target }}

      # Only inline library unit tests remain; this is not integration/parity coverage.
      - name: Library unit tests
        run: cargo test --locked --release --lib --no-default-features ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Smoke-test the native binary
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/nect${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$BIN" --version
          "$BIN" doctor
          if [ "${{ matrix.variant }}" = "full" ]; then
            "$BIN" --version | tr -d '\r' | grep -Fx 'built-ins: core + lsp, pkg, ffi'
          else
            "$BIN" --version | tr -d '\r' | grep -Fx 'built-ins: core only'
          fi
          "$BIN" check examples/hello.nct
          "$BIN" run examples/hello.nct
          printf 'let total = 0\nlet i = 0\nwhile i < 10 { total = total + i\n  i = i + 1 }\nprint(total)\n' > smoke.nct
          "$BIN" run smoke.nct | tr -d '\r' | grep -Fx 45
          "$BIN" run --interp smoke.nct | tr -d '\r' | grep -Fx 45

      - name: Unix installer syntax
        if: runner.os != 'Windows' && matrix.variant == 'lean'
        run: sh -n scripts/install.sh

      - name: Windows installer syntax (PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.variant == 'lean'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  quality:
    name: Source checks and API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Compile every optional feature
        run: cargo check --locked --all-features --lib --bins

      - name: Clippy (lean)
        run: cargo clippy --locked --no-default-features --lib --bins -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --all-features --lib --bins -- -D warnings

      - name: Library unit tests (all features)
        run: cargo test --locked --all-features --lib

      # The API reference includes optional groups that are not in `full`.
      - name: Check the committed API reference
        run: |
          cargo run --locked --all-features -- doc --out reference
          diff -u docs/API.md reference/API.md

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: editors/vscode/nect-language
        run: npm ci
      - name: Type-check
        working-directory: editors/vscode/nect-language
        run: npx tsc --noEmit -p tsconfig.json
