name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Create release archive
        run: |
          mkdir -p nect-${{ github.ref_name }}-linux
          cp target/release/nect nect-${{ github.ref_name }}-linux/
          tar czf nect-${{ github.ref_name }}-linux.tar.gz nect-${{ github.ref_name }}-linux/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nect-${{ github.ref_name }}-linux.tar.gz
