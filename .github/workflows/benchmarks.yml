name: Benchmarks

# Performance is measured, not assumed. This workflow reports timings on a
# schedule and on demand, and fails a pull request that regresses a benchmark
# beyond the agreed threshold.
#
# The comparison lives in `scripts/bench-regression.sh` rather than here, so the
# same check runs locally before a change is pushed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Sunday 02:00 UTC. Long enough between runs that a one-off
    # perturbation does not become the baseline, short enough to catch a
    # regression before a release.
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  regression:
    name: Performance regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # Verifies each benchmark still produces the output recorded when the
      # baseline was taken, so a "fast" run that computed the wrong answer is
      # rejected before its timing is believed.
      - name: Check for a regression
        run: ./scripts/bench-regression.sh

      - name: Record the timings
        if: always()
        run: |
          mkdir -p results
          ./scripts/bench-regression.sh --threshold 1000000 || true
          cp benches/baseline.tsv results/ 2>/dev/null || true

      - name: Cross-language comparison
        if: always()
        run: |
          # The Nect-vs-CPython numbers that go in the README, produced the same
          # way every time so two reports are comparable.
          sudo apt-get update
          sudo apt-get install -y python3
          HEAVY=0 REPEATS=8 ./benches/benchmark.sh 2>&1 | tee results/comparison.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
          retention-days: 30
