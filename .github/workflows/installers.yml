name: Installers

on:
  push:
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/test_install.py'
      - '.github/workflows/installers.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/test_install.py'
      - '.github/workflows/installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: Offline installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sh -n scripts/install.sh
      - run: python3 scripts/test_install.py

  windows-syntax:
    name: Windows installer syntax (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
